# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed At 12:00 on every day-of-month.
internal_check_new_versions_job:
  cron: '0 12 */1 * *'
  class: 'Internal::CheckNewVersionsJob'
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 15 minutes
# to assign unassigned conversations for all inboxes
bulk_auto_assignment_job:
  cron: '*/15 * * * *'
  class: 'Inboxes::BulkAutoAssignmentJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping

# executed every 5 minutes
# polls Graph API for new comments on externally mentioned posts
# (Facebook does not deliver feed webhooks for comments on external walls)
facebook_mention_comments_poll_job:
  cron: '*/5 * * * *'
  class: 'Webhooks::FacebookMentionCommentsPollJob'
  queue: scheduled_jobs

# executed every 5 minutes
# polls Graph API `/tags` edge for posts mentioning our IG business account
# (Instagram only delivers webhooks for STORY mentions in real time)
instagram_mentions_poll_job:
  cron: '*/5 * * * *'
  class: 'Webhooks::InstagramMentionsPollJob'
  queue: scheduled_jobs

# executed every 5 minutes
# polls Graph API `/{threads-user-id}/mentions` for threads mentioning our account
# (webhook delivery is subject to indexing lag on Threads, same as Instagram)
threads_mentions_poll_job:
  cron: '*/5 * * * *'
  class: 'Webhooks::ThreadsMentionsPollJob'
  queue: scheduled_jobs

# executed daily at 03:00 UTC
# refreshes Threads long-lived tokens approaching expiry (within 10 days)
threads_token_refresh_job:
  cron: '0 3 * * *'
  class: 'Webhooks::ThreadsTokenRefreshJob'
  queue: scheduled_jobs

# executed every 2 minutes
# polls X API v2 `/2/users/:id/mentions` as a fallback for accounts that
# don't have Account Activity webhook delivery (or while it is lagging).
# 2-min cadence stays safely under the X Basic tier limit (10 reqs / 15 min).
x_mentions_poll_job:
  cron: '*/2 * * * *'
  class: 'Webhooks::XMentionsPollJob'
  queue: scheduled_jobs

# executed every minute
# polls X API v2 `/2/dm_events` for incoming DMs (OAuth 1.0a fallback when
# Account Activity API webhook delivery is unavailable).
x_dm_poll_job:
  cron: '* * * * *'
  class: 'Webhooks::XDmPollJob'
  queue: scheduled_jobs

# executed every 3 minutes
# polls X API v2 recent search `to:<username>` for tweet replies that target
# the connected user even when they don't @-mention us in the visible text,
# plus a batched `conversation_id:(...)` scan over recent open mention threads.
# 3-min cadence keeps us well under the Basic tier limit (60 reqs / 15 min).
x_replies_poll_job:
  cron: '*/3 * * * *'
  class: 'Webhooks::XRepliesPollJob'
  queue: scheduled_jobs

# executed every 5 minutes
# polls LinkedIn REST `/posts` + `/socialActions/{urn}/comments` for new
# comments on our authored posts (member or org). Webhook-recovery fallback
# for environments without Community Management API event delivery.
linkedin_comments_poll_job:
  cron: '*/5 * * * *'
  class: 'Webhooks::LinkedinCommentsPollJob'
  queue: scheduled_jobs

# executed every 5 minutes
# polls LinkedIn organization notifications for org mentions when
# `r_organization_admin` is granted; otherwise no-ops.
linkedin_mentions_poll_job:
  cron: '*/5 * * * *'
  class: 'Webhooks::LinkedinMentionsPollJob'
  queue: scheduled_jobs

# executed daily at 03:00 UTC
# refreshes LinkedIn 60-day tokens approaching expiry (within 10 days)
# when the app has the Refresh Tokens product enabled.
linkedin_token_refresh_job:
  cron: '0 3 * * *'
  class: 'Webhooks::LinkedinTokenRefreshJob'
  queue: scheduled_jobs

# executed every 5 minutes — polls YouTube Data API v3 for new comments on
# all videos in the connected channel (via commentThreads.list).
youtube_comments_poll_job:
  cron: '*/5 * * * *'
  class: 'Webhooks::YoutubeCommentsPollJob'
  queue: scheduled_jobs

# executed every 15 minutes — polls Google Play Developer API for new reviews.
# Play API only surfaces reviews from the last ~7 days; aligns with the 7-day reply window.
play_store_reviews_poll_job:
  cron: '*/15 * * * *'
  class: 'Webhooks::PlayStoreReviewsPollJob'
  queue: scheduled_jobs

# executed every 15 minutes — polls App Store Connect for customer reviews
# and any developer responses on the configured app.
app_store_reviews_poll_job:
  cron: '*/15 * * * *'
  class: 'Webhooks::AppStoreReviewsPollJob'
  queue: scheduled_jobs

# Banking demo: every minute — sweep ended shifts, force-logout agents.
shifts_schedule_sweep_job:
  cron: '* * * * *'
  class: 'Shifts::ScheduleSweepJob'
  queue: scheduled_jobs

# Banking demo (#7): every minute — purge expired conversation locks.
conversation_lock_sweep_job:
  cron: '* * * * *'
  class: 'Internal::ConversationLockSweepJob'
  queue: scheduled_jobs

